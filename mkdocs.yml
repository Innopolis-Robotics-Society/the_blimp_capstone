site_name: The Blimp Capstone
site_description: Engineering handbook for the autonomous indoor airship proof of concept
site_url: https://innopolis-robotics-society.github.io/the_blimp_capstone/
repo_url: https://github.com/Innopolis-Robotics-Society/the_blimp_capstone
repo_name: Innopolis-Robotics-Society/the_blimp_capstone
edit_uri: edit/main/docs/
copyright: Innopolis Robotics Society · Stage 1 proof of concept · July 2026

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Project:
      - Overview: index.md
      - System architecture: architecture.md
  - Engineering:
      - Hardware: hardware.md
      - Software: software.md
  - Use the system:
      - Installation and launch: getting-started.md
      - Dashboard API: api.md
