# UWB positioning stack:
#   docker compose --profile live up --build     живое железо (консоль P-A по USB)
#   docker compose --profile replay up --build   демо из записи, железо не нужно
#   docker compose up dashboard                  только веб-дашборд (UDP :9999 ждёт данных)
services:
  info:
    build: .
    depends_on: [dashboard]
    restart: "no"
    command:
      - sh
      - -c
      - |
        cat <<'EOF'

        ╔════════════════════════════════════════════════════════════════╗
        ║  Blimp UWB dashboard — 3D-визуализация сети Nooploop LinkTrack  ║
        ╚════════════════════════════════════════════════════════════════╝

          Интерфейс:   http://localhost:8000
                       (с другого устройства: http://<IP этой машины>:8000)

          Показывает якоря A0..A3, теги T1 (нос) / T2 (корма), ось блимпа
          с курсом, дальности до якорей. Координаты якорей — в панели
          «Якоря» интерфейса или в файле dashboard/anchors.json.

          Источник данных (профили):
            docker compose --profile live up -d     живая консоль P-A (USB)
            docker compose --profile replay up -d   запись, железо не нужно

          Если сцена пустая — теги спят/выключены: консоль шлёт пустые
          keep-alive кадры 1 Гц, точки появятся сами при включении тегов.
        EOF

  dashboard:
    build: .
    command: blimp-dashboard --http-port 8000 --udp-port 9999 --anchors /config/anchors.json
    ports:
      - "8000:8000"
      - "14550:14550/udp"
    volumes:
      - ./dashboard/anchors.json:/config/anchors.json
    restart: unless-stopped

  nlink:
    build: .
    profiles: [live]
    command: sh -c 'nlink-dump --port "$$UWB_PORT" --baud "$$UWB_BAUD" --udp dashboard:9999 --quiet'
    environment:
      UWB_PORT: ${UWB_PORT:-/dev/ttyCH343USB0}
      UWB_BAUD: ${UWB_BAUD:-921600}
    devices:
      - ${UWB_PORT:-/dev/ttyCH343USB0}:${UWB_PORT:-/dev/ttyCH343USB0}
    depends_on: [dashboard]
    restart: unless-stopped

  replay:
    build: .
    profiles: [replay]
    command: nlink-dump --replay /data/uwb_live.bin --replay-delay 0.05 --loop --udp dashboard:9999 --quiet
    volumes:
      - ./recordings:/data:ro
    depends_on: [dashboard]
    restart: unless-stopped
