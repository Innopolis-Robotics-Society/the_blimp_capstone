[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blimp-dashboard"
version = "0.2.0"
description = "Single-tag UWB dashboard and real MAVLink ground station"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pymavlink"
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
blimp-dashboard = "blimp_dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blimp_dashboard = ["static/index.html", "static/app.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
